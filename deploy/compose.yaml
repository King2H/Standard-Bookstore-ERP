# The shop's install (#31): run by deploy/install.ps1 or deploy/install.sh,
# which write .env beside this file. Nothing here holds a secret.
name: bookstore

# Every service's log is kept by Docker in rotating files (#32, owner decision
# 2a): 5 files of 10 MB each, compressed, so at most about 50 MB a service.
# `docker compose logs` reads them; deploy/logs.ps1 or logs.sh saves them for support.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${BMS_DB_OWNER_PASSWORD:?run the installer first}
    # Not published on the network: only the other services reach it.
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Applies the migrations and makes sure the API's database user works, once,
  # before the API starts (owner decision 4a). The installer also runs the
  # first-accounts step with this image.
  migrate:
    logging: *logging
    build: { context: .., dockerfile: deploy/Dockerfile, target: api, secrets: [extra_ca] }
    image: bookstore-api:${BMS_VERSION:-local}
    command: ["node", "migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://bms:${BMS_DB_OWNER_PASSWORD}@postgres:5432/bms
      DATABASE_URL: postgres://bms_api:${BMS_DB_API_PASSWORD:?run the installer first}@postgres:5432/bms
      # Migration 52 encrypts customer contacts with the API's key.
      COLUMN_ENCRYPTION_KEY: ${BMS_COLUMN_ENCRYPTION_KEY:?run the installer first}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    logging: *logging
    image: bookstore-api:${BMS_VERSION:-local}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://bms_api:${BMS_DB_API_PASSWORD}@postgres:5432/bms
      JWT_SECRET: ${BMS_JWT_SECRET:?run the installer first}
      COLUMN_ENCRYPTION_KEY: ${BMS_COLUMN_ENCRYPTION_KEY}
      # The screens are served from the same addresses as the API.
      FRONTEND_URL: ${BMS_ORIGINS:?run the installer first}
      # One proxy in front: Caddy.
      TRUST_PROXY: "1"
      # The backup service below records its runs; Admin and Super_Admin see them (#244).
      BMS_BACKUPS: "on"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Nightly backups, and at start when the last good one is older than a day
  # (#244). Each is one encrypted file: the database, .env and the
  # certificate authority. Kept: 14 daily, 8 weekly.
  backup:
    logging: *logging
    build: { context: .., dockerfile: deploy/Dockerfile, target: backup, secrets: [extra_ca] }
    image: bookstore-backup:${BMS_VERSION:-local}
    environment:
      MIGRATION_DATABASE_URL: postgres://bms:${BMS_DB_OWNER_PASSWORD}@postgres:5432/bms
      BMS_BACKUP_PASSPHRASE: ${BMS_BACKUP_PASSPHRASE:?run the installer again, it asks for the backup passphrase}
      BMS_BACKUP_TIME: ${BMS_BACKUP_TIME:-02:30}
      BMS_TIMEZONE: ${BMS_TIMEZONE:-Africa/Addis_Ababa}
    volumes:
      - ./.env:/bundle/.env:ro
      - caddy_data:/caddy-data:ro
      - ${BMS_BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    logging: *logging
    build: { context: .., dockerfile: deploy/Dockerfile, target: web, secrets: [extra_ca] }
    image: bookstore-web:${BMS_VERSION:-local}
    environment:
      BMS_SITE_ADDRESSES: ${BMS_SITE_ADDRESSES:?run the installer first}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      # The shop's certificate authority and certificates: back it up with the data.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

# Behind a proxy that inspects HTTPS: its certificate authority, for the build only
# (copy it to deploy/extra-ca.pem and set BMS_EXTRA_CA_FILE=./extra-ca.pem in .env).
secrets:
  extra_ca:
    file: ${BMS_EXTRA_CA_FILE:-./no-extra-ca.pem}

volumes:
  pgdata18:
  caddy_data:
  caddy_config:
