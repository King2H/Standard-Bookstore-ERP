# Render.com deployment configuration (reference only)
# Redis is NOT included — Render removed it from the free tier.
# The app works without Redis (config caching falls back to DB).

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: bms-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: bms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COLUMN_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://bms-web.onrender.com
    healthCheckPath: /api/health

  # ── Frontend (Static Site) ───────────────────────────────────────────────────
  - type: web
    name: bms-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=apps/web
    staticPublishPath: ./apps/web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://bms-api.onrender.com

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: bms-db
    plan: free
    databaseName: bms
    user: bms
