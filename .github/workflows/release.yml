name: Release

# A release of the bookstore (#33, owner decision 3a), started by hand from
# main with the version (Actions → Release → Run workflow). It checks the
# version is package.json's and that CI passed on the commit, writes the notes
# from the PRs merged since the last release, and makes a DRAFT release with
# the install bundle. The owner reviews the draft and publishes it; GitHub
# tags the commit vX.Y.Z then. Nothing is tagged or published here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, as in package.json (e.g. 2.0.0, or 2.0.0-rc.1 for a pre-release)"
        required: true
        type: string

permissions:
  contents: write # the draft release
  checks: read # CI's results on the commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: From main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Error: a release is made from main, not ${GITHUB_REF#refs/heads/}." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The version is package.json's
        run: node scripts/release.mjs version "$VERSION"
      - name: Not released already
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Error: v$VERSION exists already (a tag or a release)." >&2
            exit 1
          fi
      - name: CI passed on this commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs' > check-runs.json
          node scripts/release.mjs ci check-runs.json
      - name: Notes and install bundle
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          node scripts/release.mjs notes "$VERSION" "$GITHUB_REPOSITORY" "$previous" > notes.md
          git archive --format=zip --prefix="bookstore-$VERSION/" -o "bookstore-$VERSION.zip" "$GITHUB_SHA"
          sha256sum "bookstore-$VERSION.zip" > SHA256SUMS
          cat notes.md
      - name: Draft release
        run: |
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "v$VERSION" --draft "${pre[@]}" --target "$GITHUB_SHA" \
            --title "Bookstore $VERSION" --notes-file notes.md "bookstore-$VERSION.zip" SHA256SUMS
          echo "Draft release v$VERSION made: review it under Releases and publish it." >> "$GITHUB_STEP_SUMMARY"
